name: Programmable NPU regression
on:
  pull_request:
    paths: ['hardware/npu/**', 'hardware/soc/rtl/control/**', 'hardware/soc/rtl/my_soc_top.sv', 'hardware/soc/sim/**', 'software/host/**', '.github/workflows/tinycnn8.yml']
  push:
    branches: [main]
    paths: ['hardware/npu/**', 'hardware/soc/rtl/control/**', 'hardware/soc/rtl/my_soc_top.sv', 'hardware/soc/sim/**', 'software/host/**', '.github/workflows/tinycnn8.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rtl:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install simulator
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Five operators, fusion, two array widths, controller, JTAG and memory stalls
        run: python hardware/npu/scripts/run_program_regression.py --output build/program_ci
      - name: Explore consecutive convolution row buffering
        run: python software/host/explore_conv_streaming.py --output build/conv_streaming.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: programmable-npu-evidence
          path: |
            build/program_ci
            build/conv_streaming.json
          retention-days: 14
