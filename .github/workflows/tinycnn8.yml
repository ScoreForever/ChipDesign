name: Programmable NPU regression
on:
  pull_request:
    paths: ['hardware/asic/**', 'hardware/npu/**', 'hardware/soc/rtl/control/**', 'hardware/soc/rtl/my_soc_top.sv', 'hardware/soc/sim/**', 'software/host/**', 'software/zoo/**', 'software/tests/**', 'verification/fpga/**', 'docs/validation/int4_v2/zoo_eval.json', '.github/workflows/tinycnn8.yml']
  push:
    branches: [main]
    paths: ['hardware/asic/**', 'hardware/npu/**', 'hardware/soc/rtl/control/**', 'hardware/soc/rtl/my_soc_top.sv', 'hardware/soc/sim/**', 'software/host/**', 'software/zoo/**', 'software/tests/**', 'verification/fpga/**', 'docs/validation/int4_v2/zoo_eval.json', '.github/workflows/tinycnn8.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rtl:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install simulator
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Seven operators, fusion, 8x8 array and 128 descriptors, controller, JTAG and memory stalls
        run: python hardware/npu/scripts/run_program_regression.py --output build/program_ci
      - name: Two physical SRAM interface models and shared capacity
        run: python hardware/npu/scripts/run_program_regression.py --quick --skip-unit --macro-model hardware/npu/tb/ra1shd_functional_model.sv --only full_activation_12k,spill_residual,descriptors_128 --output build/banked_ci
      - name: ASIC/FPGA waveform configuration and retained operator summaries
        run: python hardware/npu/scripts/run_trace_configuration.py --output build/trace_configuration_ci
      - name: Explore consecutive convolution row buffering
        run: python software/host/explore_conv_streaming.py --output build/conv_streaming.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: programmable-npu-evidence
          path: |
            build/program_ci
            build/banked_ci
            build/trace_configuration_ci
            build/conv_streaming.json
          retention-days: 14

  model-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: INT4 compiler and numeric contract
        run: python -m unittest discover -s software/tests -p 'test_npu_int4.py' -v
      - name: Recompile seven published models and verify golden outputs
        run: python software/zoo/check_golden.py
      - name: Independently reconstruct full-test-set metrics from archived predictions
        run: python verification/fpga/evidence/check_int4_v2_full_accuracy.py

  pnr-framework:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Tcl for isolated routing-policy tests
        run: sudo apt-get update && sudo apt-get install -y tcl
      - name: Geometry, acceptance, timeouts and immutable handoff tests
        run: python -m unittest discover -s hardware/asic/optimize -p 'test_*.py' -v
