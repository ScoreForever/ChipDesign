# For the course CV32E40P/Debug Module bitstream only.
# Load lab6_ft232h.cfg first, then this file, then issue init; halt.
# The exp/no_cpu branch uses nocpu_openocd.cfg instead.
reset_config none
jtag newtap riscv cpu -irlen 5
target create riscv.cpu riscv -chain-position riscv.cpu -coreid 0
gdb report_data_abort enable
gdb report_register_access_error enable
riscv set_command_timeout_sec 120
riscv set_mem_access progbuf sysbus abstract
