# Supply your adapter configuration FIRST. This is a dedicated FPGA fabric TAP,
# wired to fpga_top's tck/tms/td_i/td_o pins, NOT the FPGA configuration TAP.
# Example: openocd -f <adapter.cfg> -f software/host/nocpu_openocd.cfg
transport select jtag
adapter speed 1000
reset_config none
jtag newtap npu tap -irlen 5 -expected-id 0x00000001
tcl_port 6666
init
# No RISC-V target, halt, resume, SBA or firmware download is involved.
